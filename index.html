<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Sabor Chingón | Comida Mexicana</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: none;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(196, 30, 58, 0.15) 15%, 
                rgba(196, 30, 58, 0.55) 50%, 
                rgba(196, 30, 58, 0.15) 85%, 
                transparent 100%);
            filter: blur(4px);
            opacity: 0.85;
        }

        .brand-name {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Oswald', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f0f0f0;
            white-space: nowrap;
        }

        .brand-name span {
            color: #c41e3a;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #f0f0f0;
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #c41e3a;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover {
            color: #c41e3a;
            border-color: rgba(196, 30, 58, 0.5);
            background: rgba(196, 30, 58, 0.08);
        }

        nav a:hover::after {
            width: 60%;
        }

        .header-logo {
            height: 52px;
            width: auto;
            border-radius: 6px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }

        .header-logo:hover {
            transform: scale(1.06);
        }

        /* ===== HERO ===== */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 70px 20px 100px;
            background: #0f0f0f;
            position: relative;
            min-height: 480px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 0;
            opacity: 0.18;
            filter: blur(6px);
        }

        .hero-bg img {
            width: 25%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(15, 15, 15, 0.35) 0%,
                rgba(15, 15, 15, 0.8) 55%,
                #0f0f0f 100%
            );
            z-index: 1;
        }

        .arrow {
            font-size: 42px;
            cursor: default;
            color: #555;
            user-select: none;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.6;
            position: relative;
            z-index: 5;
        }

        .logo-container {
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .logo-container img {
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.7));
            transition: transform 0.4s ease;
            border-radius: 10px;
        }

        .logo-container img:hover {
            transform: scale(1.04);
        }

        .logo-tagline {
            margin-top: 22px;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #c41e3a;
            max-width: 420px;
            line-height: 1.5;
            margin-left: auto;
            margin-right: auto;
        }

        .logo-tagline span {
            color: #ccc;
            font-weight: 400;
            letter-spacing: 1.2px;
            display: block;
            margin-top: 5px;
            font-size: 13px;
        }

        /* ===== DIFUMINADO DE LA LÍNEA (la que marcaste en rojo) ===== */
        .fade-divider {
            height: 80px;
            margin-top: -80px;
            position: relative;
            z-index: 10;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(26, 26, 26, 0.3) 30%,
                rgba(26, 26, 26, 0.7) 60%,
                #1a1a1a 100%
            );
            pointer-events: none;
        }

        /* ===== SECCIÓN INFERIOR ===== */
        .bottom-section {
            padding: 20px 20px 70px;
            text-align: center;
            background: #1a1a1a;
            position: relative;
            z-index: 5;
        }

        .decorative-lines {
            margin: 10px auto 45px;
            width: 280px;
            height: 50px;
            position: relative;
        }

        .decorative-lines div {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 12px;
            border-radius: 50px;
            background: #c41e3a;
            filter: blur(12px);
            opacity: 0.45;
        }

        .decorative-lines div:nth-child(1) { width: 100%; top: 0; filter: blur(16px); opacity: 0.3; }
        .decorative-lines div:nth-child(2) { width: 65%; top: 18px; filter: blur(12px); opacity: 0.4; }
        .decorative-lines div:nth-child(3) { width: 35%; top: 34px; filter: blur(10px); opacity: 0.5; }

        .boxes {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
        }

        .box {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(196, 30, 58, 0.6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(145deg, #222, #1a1a1a);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.35s ease;
        }

        .box:hover {
            transform: translateY(-8px) scale(1.08);
            border-color: #c41e3a;
            box-shadow: 0 15px 30px rgba(196, 30, 58, 0.25);
        }

        .contact-info {
            margin-top: 35px;
            font-size: 15px;
            line-height: 2.1;
            color: #bbb;
        }

        .contact-info span {
            display: block;
        }

        .contact-info strong {
            color: #c41e3a;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            margin-right: 6px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 40px;
        }

        .social-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: linear-gradient(145deg, #252525, #1a1a1a);
            border: 1.5px solid rgba(196, 30, 58, 0.45);
            color: #f0f0f0;
            transition: all 0.35s ease;
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .social-btn:hover {
            transform: translateY(-6px) scale(1.1);
            border-color: #c41e3a;
            color: #fff;
            box-shadow: 0 12px 25px rgba(196, 30, 58, 0.3);
        }

        .social-btn.tiktok:hover {
            border-color: #ff0050;
            box-shadow: 0 12px 25px rgba(255, 0, 80, 0.35);
        }

        .social-btn.facebook:hover {
            background: #1877f2;
            border-color: #1877f2;
        }

        .social-btn.instagram:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: #e1306c;
        }

        @media (max-width: 768px) {
            header { padding: 10px 16px; }
            .brand-name { font-size: 15px; }
            nav ul { gap: 12px; }
            nav a { font-size: 13px; padding: 5px 10px; }
            .header-logo { height: 42px; }
            .hero { gap: 16px; padding: 50px 15px 80px; }
            .arrow { font-size: 28px; width: 42px; height: 42px; }
            .logo-container img { max-width: 240px; }
            .logo-tagline { font-size: 12px; }
            .fade-divider { height: 60px; margin-top: -60px; }
            .boxes { gap: 16px; }
            .box { width: 68px; height: 68px; font-size: 26px; }
        }
    </style>
</head>
